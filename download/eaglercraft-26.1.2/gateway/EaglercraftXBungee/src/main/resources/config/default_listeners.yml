# EaglercraftXBungee Default Listener Configuration
# Version: 26.1.2
# Each listener defines a WebSocket endpoint that EaglerCraft browser clients can connect to.
# You can define multiple listeners on different ports for different server groups.

listeners:
  # Default listener configuration
  - name: "default"
    # Whether this listener is enabled
    enabled: true
    # Host address to bind the WebSocket server to (0.0.0.0 = all interfaces)
    host: "0.0.0.0"
    # WebSocket server port
    port: 8081
    # Display name shown in the EaglerCraft server browser
    server_name: "EaglerCraft Server"
    # Default BungeeCord server to connect players to after login
    default_server: "lobby"
    # Fallback servers if the default is unavailable
    fallback_servers:
      - "lobby"
      - "survival"
    # Maximum number of players allowed on this listener
    max_players: 60
    # Whether to require authentication before allowing gameplay
    require_auth: false
    # Enable custom skin support on this listener
    enable_skins: true
    # Enable custom cape support on this listener
    enable_capes: true
    # Enable voice chat relay on this listener
    enable_voice_chat: true
    # Whether to allow offline download clients to connect
    allow_offline_downloads: false
    # WebSocket server path (for reverse proxy routing)
    websocket_path: "/"
    # Origin whitelist for CORS (empty = allow all)
    allowed_origins: []
    # Forwarded headers to trust (for reverse proxy setups)
    forwarded_headers:
      - "X-Forwarded-For"
      - "X-Real-IP"
    # SSL/TLS configuration (for direct HTTPS/WSS connections)
    ssl:
      enabled: false
      keystore_path: ""
      keystore_password: ""
    # MOTD override for this specific listener (falls back to global MOTD)
    motd:
      line1: "&6EaglerCraft Server"
      line2: "&bJoin now!"
    # Server icon for the EaglerCraft server browser (path to 64x64 PNG)
    server_icon: ""
    # Rate limit override for this listener
    rate_limit:
      connections_per_minute: 15
      max_players_per_ip: 5

  # Example: Secondary listener on a different port for a creative server
  # - name: "creative"
  #   enabled: false
  #   host: "0.0.0.0"
  #   port: 8082
  #   server_name: "Creative Server"
  #   default_server: "creative"
  #   fallback_servers:
